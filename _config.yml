resume_header_intro: "<p>I'm currently up to my ears in AI-related engineering challenges, and enjoying every minute of it. My links are all above &mdash; LinkedIn, GitHub, Google Scholar, and X.</p><p>I have a PhD in mathematics (number theory, with a focus on conjectures around elliptic curves) and many years of programming experience since then, spanning machine learning, computer vision, mobile app programming, and large-scale streaming data. Previously at <a href=\"https://www.shopify.com\">Shopify</a>, <a href=\"https://mila.quebec/en/\">Mila</a>, and the <a href=\"https://math.illinois.edu/\">University of Illinois</a>, where I helped settle a 30-year-old conjecture in pure mathematics. Three US patents and nineteen <a href=\"https://scholar.google.ca/citations?user=cnec4HkAAAAJ&amp;hl=fr\">published papers</a> along the way.</p>"

