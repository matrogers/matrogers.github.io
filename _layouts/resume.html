<!DOCTYPE html>
<html lang="en">

  {% include head.html %}

  <body class="theme-{% if site.resume_theme %}{{ site.resume_theme }}{% endif %}">

    <main class="wrapper" itemscope itemtype="http://schema.org/Person">

      <header class="page-header">

        <!-- You can turn off the photo in _config.yml by setting resume_avatar to false -->
        {% if site.resume_avatar == 'true' %}
        <img src="images/avatar.jpg" alt="{{ site.resume_name }}" class="avatar" itemprop="image">
        {% endif %}

        <div class="header-text">

          <!-- Name and title are defined in the _config.yml file -->
          <h1 class="header-name" itemprop="name">{{ site.resume_name }}</h1>
          <p class="header-title" itemprop="jobTitle">{{ site.resume_title }}</p>

          <!-- Markup for the icon links lives in _includes/icon-links.html; which links appear is set in _config.yml -->
          {% include icon-links.html %}

        </div>

      </header>

      <div class="intro" itemprop="description">
        {{ site.resume_header_intro }}
      </div>

      {% if site.resume_contact_email %}
      <p class="contact">
        <span class="contact-label">Email</span>
        <a href="mailto:{{ site.resume_contact_email }}" itemprop="email">{{ site.resume_contact_email }}</a>
      </p>
      {% endif %}

    </main>

  </body>

</html>
